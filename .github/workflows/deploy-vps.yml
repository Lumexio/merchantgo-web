name: Deploy MerchantGo Web to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🌐 Deploy Executive UI (app.merchantgo.store)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.merchantgo.store

      - name: Native SSH Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /srv/merchantgo/merchantgo-web/dist && rm -rf /srv/merchantgo/merchantgo-web/dist/*"

          rsync -azP -e "ssh -o StrictHostKeyChecking=no" dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/merchantgo/merchantgo-web/dist/

          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "find /srv/merchantgo/merchantgo-web/dist -type d -exec chmod 755 {} \; 2>/dev/null || true && \
            find /srv/merchantgo/merchantgo-web/dist -type f -exec chmod 644 {} \; 2>/dev/null || true && \
            cd /srv/merchantgo && \
            docker compose exec -T nginx nginx -s reload && \
            echo '✔ Live React update verified at https://app.merchantgo.store!'"
