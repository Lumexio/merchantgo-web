name: Bug report
description: Report a reproducible MerchantGo admin web defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include route, steps, role, and tenant/branch scenario.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Authentication, Dashboard or reporting, Menu or users, Orders or cashout, Responsive UI, Deployment or API, Other]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, viewport, API environment, and sanitized console output.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, personal data, and tenant-sensitive values.
          required: true
